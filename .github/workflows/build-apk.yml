name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      # Derleme hatalarını "annotation" olarak yayınla (API'den okunabilsin)
      - name: Report compile errors
        if: failure()
        run: |
          grep -E '^e: ' build.log | head -25 | while IFS= read -r line; do echo "::error::${line}"; done || true

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PingAI.apk
          VER=$(cat app/version.txt | tr -d '[:space:]')
          gh release create "build-${{ github.run_number }}" PingAI.apk \
            --title "Ping AI v${VER}" \
            --notes "Ping AI v${VER} (build ${{ github.run_number }}). Install over the previous one." \
            --latest

      - uses: actions/upload-artifact@v4
        with:
          name: PingAI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
